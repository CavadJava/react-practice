                type: "object"
              example:
                response:
                  - version: "2026.20.1"
                    title: "Holiday Update"
                    notes: "Improved climate preconditioning and new games."
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/vehicles/{vin}/service_data":
    get:
      operationId: "serviceData"
      summary: "Get service data"
      description: "Returns service data."
      tags:
        - "Vehicle State"
      parameters:
        - name: "vin"
          in: "path"
          required: true
          description: "Vehicle Identification Number."
          schema:
            type: "string"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  service_status: "not_in_service"
                  service_etc: null
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/vehicles/{vin}/signed_command":
    post:
      operationId: "signedCommand"
      summary: "Send a signed command"
      description: "Signed Commands is a generic endpoint replacing legacy commands, used for newer vehicles that require command signing."
      tags:
        - "Vehicle Commands"
      parameters:
        - name: "vin"
          in: "path"
          required: true
          description: "Vehicle Identification Number."
          schema:
            type: "string"
      requestBody:
        required: true
        description: "`routable_message` is an opaque, signed protobuf `RoutableMessage` payload produced by Tesla's vehicle-command SDK / command-signing tooling. It is not something to construct by hand."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              routable_message: "<base64 protobuf RoutableMessage>"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  result: true
                  reason: ""
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/vehicles/{vin}/vehicle_data":
    get:
      operationId: "vehicleData"
      summary: "Get live vehicle data"
      description: "Makes a live call to the vehicle. This may return cached data if the vehicle is offline. For vehicles running firmware versions 2023.38+, location_data is required to fetch vehicle location; this results in a location sharing icon showing on the vehicle UI."
      tags:
        - "Vehicle State"
      parameters:
        - name: "vin"
          in: "path"
          required: true
          description: "Vehicle Identification Number."
          schema:
            type: "string"
        - name: "endpoints"
          in: "query"
          required: false
          description: "Semicolon-separated list of VehicleDataEndpoint values to fetch, e.g. `charge_state;climate_state;location_data;vehicle_state;vehicle_config`. `location_data` replaces the legacy `drive_state` lat/long fields."
          schema:
            type: "string"
      responses:
        "200":
          description: "Only the endpoints requested via the `endpoints` query parameter are populated in the response."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  id: 123456789012345
                  vin: "5YJ3E1EA000000001"
                  display_name: "My Model 3"
                  charge_state:
                    battery_level: 78
                    charging_state: "Disconnected"
                    charge_limit_soc: 90
                  climate_state:
                    inside_temp: 21.5
                    outside_temp: 18.0
                    is_climate_on: false
                    driver_temp_setting: 22.0
                  location_data:
                    latitude: 37.7749
                    longitude: -122.4194
                    heading: 180
                  vehicle_state:
                    locked: true
                    odometer: 12345.6
                    sentry_mode: false
                  vehicle_config:
                    car_type: "model3"
                    exterior_color: "DeepBlue"
                    wheel_type: "Sport19"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/vehicles/{vin}/wake_up":
    post:
      operationId: "wakeUp"
      summary: "Wake the vehicle"
      description: "Wakes the vehicle from sleep, which is a state to minimize idle energy consumption."
      tags:
        - "Vehicle Commands"
      parameters:
        - name: "vin"
          in: "path"
          required: true
          description: "Vehicle Identification Number."
          schema:
            type: "string"
      responses:
        "200":
          description: "Returns the vehicle object; `state` transitions from `waking` to `online` as the vehicle comes online."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  id: 123456789012345
                  vehicle_id: 999999999
                  vin: "5YJ3E1EA000000001"
                  state: "waking"
                  display_name: "My Model 3"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/oauth2/v3/authorize":
    get:
      operationId: "getLoginPage"
      summary: "Step 1: Open Tesla's login page in a browser (no PKCE, unlike the legacy API)"
      description: "Not something you call from a script — construct this URL and have the end user open it in a real browser to log in and approve your app's requested scopes. No code_challenge/code_verifier needed (this is a confidential-client flow, not PKCE). On approval, the browser is redirected to YOUR registered redirect_uri with a `code` and `state` query param."
      tags:
        - "Authentication"
      parameters:
        - name: "client_id"
          in: "query"
          required: true
          description: "YOUR app's client_id — you generate this once, by registering an application at developer.tesla.com (not a shared constant like the legacy API's 'ownerapi')."
          schema:
            type: "string"
          example: "YOUR_REGISTERED_CLIENT_ID"
        - name: "redirect_uri"
          in: "query"
          required: true
          description: "YOUR app's own redirect URI, exactly as registered at developer.tesla.com (exact match required — this is what broke the old shared void/callback trick)."
          schema:
            type: "string"
          example: "https://your-domain.example.com/api/v1/auth/callback"
        - name: "response_type"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value."
          schema:
            type: "string"
          example: "code"
        - name: "scope"
          in: "query"
          required: true
          description: "Space-separated list of requested scopes. YOU choose which ones your app needs from: openid, email, offline_access, user_data, vehicle_device_data, vehicle_location, vehicle_cmds, vehicle_charging_cmds, energy_device_data, energy_cmds."
          schema:
            type: "string"
          example: "openid email offline_access vehicle_device_data vehicle_cmds"
        - name: "state"
          in: "query"
          required: true
          description: "YOU generate this — any string, echoed back on redirect for CSRF protection (e.g. `python3 -c \"import secrets;print(secrets.token_urlsafe(16))\"`)."
          schema:
            type: "string"
          example: "ZnW5yQ3lX3bRLFvaYq6BDw"
      responses:
        "200":
          description: "After a successful login+consent, the browser is redirected to your redirect_uri with ?code=...&state=.... Copy the `code` value for Step 2."
          content:
            "text/plain":
              schema:
                type: "string"
              example: "<!-- Tesla-hosted HTML login page; the user logs in there directly, this is not a JSON API call -->"
      security: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO login page — global"
        - url: "https://auth.tesla.cn"
          description: "Tesla SSO login page — China"
  "/oauth2/v3/token":
    post:
      operationId: "exchangeCodeForToken"
      summary: "Step 2: Exchange an authorization code, or refresh_token, or app credentials for a Bearer token"
      description: "Hosted on a DIFFERENT host than Step 1 (fleet-auth.prd.vn.cloud.tesla.com, not auth.tesla.com). Three grant_type variants share this one endpoint — see the named examples: authorization_code (user-level token from Step 1's code), refresh_token (renew an expired user-level token), client_credentials (app-level 'partner' token, no specific user — used only for Partner API domain registration, see partnerLogin)."
      tags:
        - "Authentication"
      requestBody:
        required: true
        description: "grant_type in the body selects the variant — see the named examples below."
        content:
          "application/json":
            schema:
              type: "object"
            examples:
              authorization_code:
                summary: "grant_type=authorization_code"
                description: "grant_type: fixed 'authorization_code'. client_id/client_secret: YOUR app's own credentials from developer.tesla.com — unlike the legacy API there is no shared public client_id. code: dynamic, from Step 1's redirect. audience: the regional Fleet API server you intend to call (na/eu/cn — see generalNotes on discovering the right region). redirect_uri: must exactly match Step 1 and your app registration."
                value:
                  grant_type: "authorization_code"
                  client_id: "YOUR_REGISTERED_CLIENT_ID"
                  client_secret: "YOUR_REGISTERED_CLIENT_SECRET"
                  code: "<authorization code from Step 1's redirect — cannot be pre-generated, only exists after a real login>"
                  audience: "https://fleet-api.prd.na.vn.cloud.tesla.com"
                  redirect_uri: "https://your-domain.example.com/api/v1/auth/callback"
              refresh_token:
                summary: "grant_type=refresh_token"
                description: "grant_type: fixed 'refresh_token'. client_id: your app's client_id. refresh_token: previously issued. NOTE: the reference client library does not send client_secret here even though this is a confidential client — if your app's registration requires it and you get an auth error, try adding client_secret too; this is flagged unverified_path since it deviates from typical OAuth2 confidential-client behavior."
                value:
                  grant_type: "refresh_token"
                  client_id: "YOUR_REGISTERED_CLIENT_ID"
                  refresh_token: "<refresh token from a prior exchange — cannot be pre-generated, only exists after a real login>"
              client_credentials:
                summary: "grant_type=client_credentials"
                description: "grant_type: fixed 'client_credentials'. client_id/client_secret: your app's own credentials. audience: the regional server you'll register a domain against. scope: app-level scopes needed (typically just 'openid' for Partner API registration)."
                value:
                  grant_type: "client_credentials"
                  client_id: "YOUR_REGISTERED_CLIENT_ID"
                  client_secret: "YOUR_REGISTERED_CLIENT_SECRET"
                  audience: "https://fleet-api.prd.na.vn.cloud.tesla.com"
                  scope: "openid"
      responses:
        "200":
          description: "Successful token response. See the named examples for the differences between variants."
          content:
            "application/json":
              schema:
                type: "object"
              examples:
                authorization_code:
                  summary: "grant_type=authorization_code response"
                  description: "access_token: user-level Bearer token for vehicle/energy/user endpoints. refresh_token: long-lived, use it (not a new login) once access_token expires."
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expires_in: 28800
                    token_type: "Bearer"
                refresh_token:
                  summary: "grant_type=refresh_token response"
                  description: "Same shape as the authorization_code response; the refresh_token is rotated (a new one comes back — store it in place of the old one)."
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expires_in: 28800
                    token_type: "Bearer"
                client_credentials:
                  summary: "grant_type=client_credentials response"
                  description: "App-level token, NOT tied to any Tesla customer account — usable only against the Partner API (register/public_key/fleet_telemetry_errors), not vehicle/energy/user endpoints."
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expires_in: 28800
                    token_type: "Bearer"
      security: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
      servers:
        - url: "https://fleet-auth.prd.vn.cloud.tesla.com"
          description: "Token issuance/refresh — single global host regardless of region"
  "/status":
    get:
      operationId: "getApiStatus"
      summary: "Health check — returns \"ok\" if the API is operating normally"
      description: "No auth or headers required. Called against your chosen regional server (e.g. https://fleet-api.prd.na.vn.cloud.tesla.com/status)."
      tags:
        - "Authentication"
      responses:
        "200":
          description: "Plain text response body, not JSON — literally the string \"ok\"."
          content:
            "text/plain":
              schema:
                type: "string"
              example: "ok"
      security: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
