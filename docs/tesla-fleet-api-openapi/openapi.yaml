openapi: "3.0.3"
info:
  title: "Tesla Fleet API (Official)"
  version: "2026.08.16"
  description: "Tesla's **official, currently-supported** Fleet API (developer.tesla.com) — the successor to the unofficial owner-api.teslamotors.com flow, which Tesla began actively rejecting ('redirect_uri not registered') around April-May 2026. Generated by reading the source of the actively-maintained open-source client library github.com/Teslemetry/python-tesla-fleet-api rather than scraping prose docs — this reflects exact working request/response shapes as of 2026-08-16, not guesswork.\n\n**Before this is usable at all**, you need a developer.tesla.com account, a registered application (client_id/client_secret), your own publicly-hosted redirect_uri, and a public key file hosted on a domain you control — see README.md in this folder for the full checklist.\n\nGenerated notes from source:\n- This is Tesla's OFFICIAL, currently-supported Fleet API (developer.tesla.com) — the successor to the unofficial/reverse-engineered owner-api.teslamotors.com flow, which Tesla began actively locking down (real 'redirect_uri not registered' rejections) around April-May 2026.\n- Unlike the legacy flow, this one is a standard CONFIDENTIAL OAuth2 client: NO PKCE (no code_challenge/code_verifier) — instead your app has a real client_secret, and you must register your OWN redirect_uri at developer.tesla.com (the shared https://auth.tesla.com/void/callback trick does not work here).\n- Getting a working app requires, at developer.tesla.com: (1) a developer account, (2) registering an application to get client_id/client_secret, (3) hosting a public key file at https://<your-domain>/.well-known/appspecific/com.tesla.3p.public-key.pem on a domain you control, (4) calling the Partner API's 'register' endpoint once for that domain, then (5) users individually authorize your app via the login URL.\n- Three regional API servers: na=https://fleet-api.prd.na.vn.cloud.tesla.com, eu=https://fleet-api.prd.eu.vn.cloud.tesla.com, cn=https://fleet-api.prd.cn.vn.cloud.tesla.cn. The login page host also differs for China: auth.tesla.cn instead of auth.tesla.com. Token issuance/refresh (fleet-auth.prd.vn.cloud.tesla.com) is a SINGLE global host regardless of region.\n- After first getting a token, call GET /api/1/users/region (no path params) to discover which regional fleet_api_base_url your account should use for all subsequent calls — don't hardcode a region.\n- Two distinct token flows share the same POST /oauth2/v3/token endpoint: 'authorization_code'/'refresh_token' (grant_type) are USER-level tokens (act as a specific Tesla account, needed for vehicle/energy commands); 'client_credentials' (a.k.a. partner_login) is an APP-level token with no specific user, used only for the Partner API (domain registration).\n- Source: cross-referenced against the actively-maintained open-source client library github.com/Teslemetry/python-tesla-fleet-api (tesla_fleet_api/tesla/oauth.py, fleet.py, partner.py) rather than scraped prose — this is precise working code, not documentation guesswork. That library's refresh_access_token() does NOT send client_secret in the refresh_token grant body (flagged unverified_path below since that's unusual for a confidential client and may be a library simplification rather than what Tesla's server actually requires).\n- All 50 endpoints in this range are POST vehicle command endpoints under /api/1/vehicles/{vin}/command/... and require Bearer auth (auth: true).\n- They share the standard Tesla Fleet API command response envelope: {\"response\": {\"result\": bool, \"reason\": string}}.\n- Path parameter is always named `vin` (Vehicle Identification Number string), never `vehicle_id`.\n- Methods with no `json=` argument in `_request(...)` send no request body (requestBodyExample: null).\n- Enum wire values for Trunk, Seat, Level, AutoSeat, ClimateKeeperMode, and CabinOverheatProtectionTemp were inferred from well-known Tesla Fleet API conventions since tesla_fleet_api/const.py was not included in the provided source range; these are flagged as inferred/unverified in the relevant requestBodyDescription fields.\n- remote_seat_heater_request maps its `seat_position`/`seat_heater_level` parameters to wire keys `heater`/`level`; remote_auto_seat_climate_request keeps `auto_seat_position`/`auto_climate_on` as-is — note the key-name divergence.\n- The `vin` path parameter is always the vehicle's Vehicle Identification Number string (never a numeric vehicle_id).\n- `options` and `warranty_details` call undocumented internal `api/1/dx/...` routes rather than the standard `api/1/vehicles/{vin}/...` shape, and pass `vin` as a query parameter instead of a path parameter — these are marked `unverified_path: true` since they are not part of the standard public Fleet API endpoint list.\n- `vehicle_data`'s `endpoints` query parameter is a list of `VehicleDataEndpoint` values joined with `;` (e.g. `charge_state;climate_state;location_data;vehicle_state;vehicle_config`). `location_data` supersedes the legacy `drive_state` lat/long fields and is required on firmware 2023.38+ to populate vehicle location (it triggers a location-sharing icon in the vehicle UI).\n- `signed_command`'s `routable_message` field is an opaque, signed protobuf `RoutableMessage` payload produced by Tesla's vehicle-command SDK signing tooling — it is not something to construct by hand and its internal structure is not modeled here.\n- Standard command endpoints (POST .../command/...) return the envelope `{\"response\": {\"result\": bool, \"reason\": string}}`.\n- Many EnergySite convenience methods (get_system_info, raw_networking_status/get_networking_status, wifi_scan, get_device_cert, get_cellular_info, check_for_update, check_for_update_urgency, check_internet, set_local_site_config, list_authorized_clients, add_authorized_client, remove_authorized_client, get_signed_commands_public_key, get_backup_events, schedule_backup_event, cancel_backup_event, get_teg_config, set_island_mode, go_off_grid, reconnect_grid) do NOT have their own REST path. They are all client-side wrappers that build a `{category: {command: params}}` gRPC message and POST it through the single multiplexed endpoint `POST /api/1/energy_sites/{energy_site_id}/command` with a fixed envelope of `command_type=\"grpc_command\"` plus `command_properties.message` and `command_properties.identifier_type`. These are undocumented energy-device gRPC commands (reverse-engineered, not part of Tesla's published Fleet API docs) that require the `energy_cmds` OAuth scope. All other EnergySite methods (backup, backup_history, charge_history, energy_history, grid_import_export, live_status, off_grid_vehicle_charging_reserve, operation, site_info, storm_mode, time_of_use_settings) call distinct, documented REST paths directly.\n- The path parameter for every energy-site endpoint is `energy_site_id` (an integer Tesla energy site/product ID obtainable from `GET /api/1/products`), not `site_id`.\n- `set_island_mode` (and its `go_off_grid`/`reconnect_grid` convenience wrappers) always raise `SignedCommandRequired` client-side before ever constructing a gRPC message body - the cloud-only unsigned `grpc_command` path is known to be accepted by some gateway firmware without actually operating the grid contactor, so the client refuses to send it. There is no verified category/command pair for island-mode control over this endpoint; real actuation requires a signed local LAN command via a separately paired authorized client (see `add_authorized_client`)."
  license:
    name: "Source library: MIT (Teslemetry/python-tesla-fleet-api)"
    url: "https://github.com/Teslemetry/python-tesla-fleet-api"
externalDocs:
  description: "Official Tesla Fleet API docs"
  url: "https://developer.tesla.com/docs/fleet-api"
servers:
  - url: "https://fleet-api.prd.na.vn.cloud.tesla.com"
    description: "North America"
  - url: "https://fleet-api.prd.eu.vn.cloud.tesla.com"
    description: "Europe"
  - url: "https://fleet-api.prd.cn.vn.cloud.tesla.cn"
    description: "China"
tags:
  - name: "API Basics"
    description: "Account-level, cross-product endpoints (product list, partner/domain registration)."
  - name: "Authentication"
    description: "OAuth2 login (auth.tesla.com), token exchange (fleet-auth.prd.vn.cloud.tesla.com), and Partner/app-level setup. See README.md before using any of this."
  - name: "Charging"
    description: "Charging history/session billing data."
  - name: "Energy Products"
    description: "Powerwall/solar energy site history, live status, configuration, and a generic gRPC device-command relay."
  - name: "Fleet Telemetry"
    description: "Server-side streaming telemetry config push (not the data stream itself — see fleet-telemetry server docs)."
  - name: "Sharing"
    description: "Driver invites and account sharing for a vehicle."
  - name: "Users"
    description: "The authenticated Tesla account holder's profile, keys, orders, and region discovery."
  - name: "Vehicle Commands"
    description: "POST actions that change vehicle state (locks, climate, charging, etc). The vehicle must be online — see wakeUp."
  - name: "Vehicle State"
    description: "Read-only vehicle info and telemetry (GET vehicle_data with selectable data groups)."
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "OAuth2 access_token from the Authentication flow — either a user-level token (authorization_code/refresh_token) or an app-level partner token (client_credentials), depending on the endpoint."
paths:
  "/api/1/dx/charging/history":
    get:
      operationId: "getChargingHistory"
      summary: "Get paginated charging history"
      description: "Returns the paginated charging history for the account (or a specific vehicle)."
      tags:
        - "Charging"
      parameters:
        - name: "vin"
          in: "query"
          required: false
          description: "Filter to a specific vehicle."
          schema:
            type: "string"
        - name: "startTime"
          in: "query"
          required: false
          description: "ISO 8601 start of the date range."
          schema:
            type: "string"
        - name: "endTime"
          in: "query"
          required: false
          description: "ISO 8601 end of the date range."
          schema:
            type: "string"
        - name: "pageNo"
          in: "query"
          required: false
          description: "Page number."
          schema:
            type: "integer"
        - name: "pageSize"
          in: "query"
          required: false
          description: "Results per page."
          schema:
            type: "integer"
        - name: "sortBy"
          in: "query"
          required: false
          description: "Field to sort by."
          schema:
            type: "string"
        - name: "sortOrder"
          in: "query"
          required: false
          description: "'asc' or 'desc'."
          schema:
            type: "string"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  data: []
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/dx/charging/sessions":
    get:
      operationId: "getChargingSessions"
      summary: "Get charging session pricing/energy data (business accounts only)"
      description: "Returns charging session information including pricing and energy data. This endpoint is only available for business accounts that own a fleet of vehicles."
      tags:
        - "Charging"
      parameters:
        - name: "vin"
          in: "query"
          required: false
          description: "Filter to a specific vehicle."
          schema:
            type: "string"
        - name: "date_from"
          in: "query"
          required: false
          description: "Start of the date range."
          schema:
            type: "string"
        - name: "date_to"
          in: "query"
          required: false
          description: "End of the date range."
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          description: "Max results."
          schema:
            type: "integer"
        - name: "offset"
          in: "query"
          required: false
          description: "Pagination offset."
          schema:
            type: "integer"
      responses:
        "200":
          description: "Only available for business accounts."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  data: []
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/dx/vehicles/options":
    get:
      operationId: "vehicleOptions"
      summary: "Get vehicle option details"
      description: "Returns vehicle option details."
      tags:
        - "Vehicle State"
      parameters:
        - name: "vin"
          in: "query"
          required: false
          description: "Vehicle Identification Number to look up."
          schema:
            type: "string"
      responses:
        "200":
          description: "This is an internal `api/1/dx/...` route not listed among the standard public Fleet API endpoints; path/behavior unverified against official docs."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  vin: "5YJ3E1EA000000001"
                  options:
                    paint: "Deep Blue Metallic"
                    wheels: "19in Sport Wheels"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
      x-unverified-path: true
  "/api/1/dx/warranty/details":
    get:
      operationId: "warrantyDetails"
      summary: "Get warranty details"
      description: "Returns warranty details."
      tags:
        - "Vehicle State"
      parameters:
        - name: "vin"
          in: "query"
          required: false
          description: "Vehicle Identification Number to look up."
          schema:
            type: "string"
      responses:
        "200":
          description: "This is an internal `api/1/dx/...` route not listed among the standard public Fleet API endpoints; path/behavior unverified against official docs."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  vin: "5YJ3E1EA000000001"
                  warrantyDetails:
                    batteryAndDriveUnit:
                      expirationDate: "2032-01-01"
                      expirationOdometer: 120000
                    basicVehicle:
                      expirationDate: "2028-01-01"
                      expirationOdometer: 50000
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
      x-unverified-path: true
  "/api/1/energy_sites/{energy_site_id}/backup":
    post:
      operationId: "setEnergySiteBackupReserve"
      summary: "Adjust the site's backup reserve percentage."
      description: "Adjust the site's backup reserve."
      tags:
        - "Energy Products"
      parameters:
        - name: "energy_site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      requestBody:
        required: true
        description: "backup_reserve_percent: integer 0-100, the minimum state of charge to reserve for backup/off-grid use."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              backup_reserve_percent: 20
      responses:
        "200":
          description: "Echoes the newly-applied backup_reserve_percent."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  backup_reserve_percent: 20
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/energy_sites/{energy_site_id}/calendar_history":
    get:
      operationId: "getEnergySiteCalendarHistory"
      summary: "Get the site's backup-event or energy-measurement history (shared endpoint, selected by `kind`)"
      description: "One shared endpoint behind two convenience methods, distinguished only by the `kind` query parameter: kind=backup returns the backup (off-grid) event history of the site in duration of seconds; kind=energy returns the site's energy measurements aggregated to the requested period. See the named response examples for the shape of each variant."
      tags:
        - "Energy Products"
      parameters:
        - name: "energy_site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
        - name: "kind"
          in: "query"
          required: true
          description: "\"backup\" or \"energy\" — selects which history variant this call returns (see the named response examples)."
          schema:
            type: "string"
          example: "energy"
        - name: "period"
          in: "query"
          required: false
          description: "Aggregation period, e.g. \"day\", \"week\", \"month\", \"year\". Used by the energy variant; optional for backup."
          schema:
            type: "string"
        - name: "start_date"
          in: "query"
          required: false
          description: "ISO 8601 start date/time for the query range. Optional."
          schema:
            type: "string"
        - name: "end_date"
          in: "query"
          required: false
          description: "ISO 8601 end date/time for the query range. Optional."
          schema:
            type: "string"
        - name: "time_zone"
          in: "query"
          required: false
          description: "IANA time zone name used to bucket the history. Optional."
          schema:
            type: "string"
      responses:
        "200":
          description: "Response shape depends on the discriminator query parameter — see the named examples below."
          content:
            "application/json":
              schema:
                type: "object"
              examples:
                backup:
                  summary: "kind=backup"
                  description: "events array of backup/off-grid periods, each with a timestamp and duration in seconds."
                  value:
                    response:
                      events:
                        - timestamp: "2022-01-01T00:00:00Z"
                          duration: 3600
                energy:
                  summary: "kind=energy"
                  description: "time_series array of per-period energy production/consumption/import/export figures."
                  value:
                    response:
                      time_series:
                        - timestamp: "2022-01-01T00:00:00Z"
                          solar_energy_exported: 5000
                          grid_energy_imported: 1200
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/energy_sites/{energy_site_id}/command":
    post:
      operationId: "sendEnergyDeviceGrpcCommand"
      summary: "Send a gRPC command to an energy gateway device (Powerwall/TEG); single multiplexed endpoint backing ~20 convenience methods."
      description: "Sends an unsigned `grpc_command` to the energy site's gateway hardware. The request body always has the same envelope shape - `command_type: \"grpc_command\"` and `command_properties: { message: { <category>: { <command>: <params> } }, identifier_type }` - only the category/command/params vary per sub-command. These are undocumented (reverse-engineered) energy device commands and require the `energy_cmds` scope. Full catalog of convenience methods that route through this single endpoint (category, command, description):\n\n- get_system_info -> category=\"common\", command=\"get_system_info_request\": Get energy device system information including firmware version, device type, part number, serial number, and DIN.\n- raw_networking_status -> category=\"common\", command=\"get_networking_status_request\": Get raw energy device networking status including WiFi, Ethernet, and cellular connectivity.\n- get_networking_status -> client-side wrapper around raw_networking_status (same category=\"common\"/command=\"get_networking_status_request\" wire call); unwraps `response.message.Payload.Common.Message.GetNetworkingStatusResponse` from the raw result. No separate wire call.\n- wifi_scan -> category=\"common\", command=\"wifi_scan_request\": Scan for available WiFi networks from the energy gateway.\n- get_device_cert -> category=\"common\", command=\"device_cert_request\": Get the energy device certificate including subject, issuer, and validity.\n- get_cellular_info -> category=\"common\", command=\"get_cellular_info_request\": Get cellular modem information including the embedded SIM identifier (EID) and supported cellular profiles.\n- check_for_update -> category=\"common\", command=\"check_for_update_request\": Check if a firmware update is available for the energy gateway.\n- check_for_update_urgency -> category=\"common\", command=\"check_for_update_urgency_request\": Check the urgency level of any available firmware update.\n- check_internet -> category=\"common\", command=\"check_internet_request\": Test internet connectivity on the gateway across all network interfaces (WiFi, Ethernet, GSM).\n- set_local_site_config -> category=\"common\", command=\"set_local_site_config_request\": Update local site configuration on the gateway. Accepts raw protobuf request fields; writes gateway configuration and is an undocumented energy device gRPC command.\n- list_authorized_clients -> category=\"authorization\", command=\"list_authorized_clients_request\": List authorized clients (paired keys) on the gateway including their roles and state. Best-effort cloud check only; not authoritative for local key verification.\n- add_authorized_client -> category=\"authorization\", command=\"add_authorized_client_request\", params={key_type, public_key (base64), authorized_client_type, description}: Register an authorized client (public key) with the gateway for local signed LAN control (TEDapi v1r). Key stays PENDING_VERIFICATION until a physical presence proof (e.g. breaker toggle) within a ~9-minute window, or reaches the terminal PENDING_VERIFICATION_TIMEOUT state.\n- remove_authorized_client -> category=\"authorization\", command=\"remove_authorized_client_request\", params={public_key (base64)}: Remove an authorized client (public key) from the gateway. [UNVERIFIED against hardware over this cloud route - inferred from add_authorized_client]. Response body may be empty. No physical presence proof required to remove, including VERIFIED records.\n- get_signed_commands_public_key -> category=\"authorization\", command=\"get_signed_commands_public_key_request\": Get the energy gateway's public key for signed commands.\n- get_backup_events -> category=\"teg\", command=\"get_backup_events_request\": Get backup event history from the gateway. May time out on some firmware versions.\n- schedule_backup_event -> category=\"teg\", command=\"schedule_manual_backup_event_request\", params={scheduling_info: {start_time, duration_seconds, priority}} (all optional): Schedule a manual backup event on the gateway.\n- cancel_backup_event -> category=\"teg\", command=\"cancel_manual_backup_event_request\": Cancel a scheduled manual backup event on the gateway.\n- get_teg_config -> category=\"teg\", command=\"get_config_request\": Get Tesla Energy Gateway configuration from the TEG service.\n- set_island_mode -> would target island-mode control, but the client always raises SignedCommandRequired before sending; no category/command is ever transmitted through this cloud path (unsigned grpc_command has been observed accepted without physically operating the grid contactor). Real control requires a signed local LAN command.\n- go_off_grid -> convenience wrapper calling set_island_mode(OFF_GRID); always raises SignedCommandRequired the same way.\n- reconnect_grid -> convenience wrapper calling set_island_mode(ON_GRID); always raises SignedCommandRequired the same way."
      tags:
        - "Energy Products"
      parameters:
        - name: "energy_site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      requestBody:
        required: true
        description: "Envelope is fixed: `command_type` is always \"grpc_command\". `command_properties.message` is a single-key object `{category: {command: params}}` selecting the sub-command (see description for the full catalog); `params` is command-specific and may be an empty object. `command_properties.identifier_type` is an integer enum (EnergyDeviceIdentifierType, default GATEWAY_DIN) identifying which device on the site the command targets. Example shown is the get_system_info sub-command."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              command_type: "grpc_command"
              command_properties:
                message:
                  common:
                    get_system_info_request: {}
                identifier_type: 0
      responses:
        "200":
          description: "Response shape is sub-command-specific and nested under response.message per the gRPC payload structure (see get_networking_status's own unwrap path as an example: response.message.Payload.Common.Message.GetNetworkingStatusResponse). remove_authorized_client may return an empty body - callers should not assert on response fields for it."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  message:
                    Payload:
                      Common:
                        Message:
                          "...": "sub-command-specific gRPC response payload, shape varies per category/command"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/energy_sites/{energy_site_id}/grid_import_export":
    post:
      operationId: "setEnergySiteGridImportExport"
      summary: "Allow/disallow charging from the grid and exporting energy to the grid."
      description: "Allow/disallow charging from the grid and exporting energy to the grid."
      tags:
        - "Energy Products"
      parameters:
        - name: "energy_site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      requestBody:
        required: true
        description: "disallow_charge_from_grid_with_solar_installed: boolean, prevents charging the battery from the grid when solar is installed. customer_preferred_export_rule: string enum (EnergyExportMode), e.g. \"pv_only\", \"battery_ok\", \"never\". Both fields optional."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              disallow_charge_from_grid_with_solar_installed: true
              customer_preferred_export_rule: "pv_only"
      responses:
        "200":
          description: "Echoes the applied grid import/export settings."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  disallow_charge_from_grid_with_solar_installed: true
                  customer_preferred_export_rule: "pv_only"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
        description: "Source documentation"
  "/api/1/energy_sites/{energy_site_id}/live_status":
    get:
      operationId: "getEnergySiteLiveStatus"
      summary: "Get the live status of the site (power, state of energy, grid status, storm mode)."
      description: "Returns the live status of the site (power, state of energy, grid status, storm mode)."
      tags:
        - "Energy Products"
      parameters:
        - name: "energy_site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Live power flow figures (watts) for solar, battery, load, grid; state-of-energy percentage; grid connection status; storm mode flag."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  solar_power: 1500
                  energy_left: 12000
                  total_pack_energy: 13500
                  percentage_charged: 88.9
                  grid_status: "Active"
                  storm_mode_active: false
                  battery_power: -200
                  load_power: 1300
                  grid_power: 0
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://developer.tesla.com/docs/fleet-api"
