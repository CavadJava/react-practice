  "/oauth2/v3/authorize":
    get:
      operationId: "getLoginPage"
      summary: "Step 1: Obtain the SSO login page and session"
      description: "Starts the OAuth2/PKCE authorization_code flow. Before calling, generate an 86-character random code_verifier and compute code_challenge as the URL-safe base64 SHA-256 hash of it. Returns an HTML login form with hidden fields and sets a session cookie required by step 2."
      tags:
        - "Authentication"
      parameters:
        - name: "client_id"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value, every request."
          schema:
            type: "string"
          example: "ownerapi"
        - name: "code_challenge"
          in: "query"
          required: true
          description: "URL-safe base64 SHA-256 hash of the code_verifier — YOU generate a fresh (verifier, challenge) pair per login attempt; the example is a valid matching sample for reference only. Recipe: code_verifier = random 43-128 char string from [A-Za-z0-9-._~] -> code_challenge = base64url(SHA256(code_verifier)) with '=' padding stripped."
          schema:
            type: "string"
          example: "UD9XsJ5psxMmlMb061H0n0iS8l7-tkcZgBgSXcN8PfE"
        - name: "code_challenge_method"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value, every request."
          schema:
            type: "string"
          example: "S256"
        - name: "redirect_uri"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value, every request (the address deliberately does not resolve; the code is read from the 302's Location header, the redirect is never followed)."
          schema:
            type: "string"
          example: "https://auth.tesla.com/void/callback"
        - name: "response_type"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value, every request."
          schema:
            type: "string"
          example: "code"
        - name: "scope"
          in: "query"
          required: true
          description: "Fixed constant — always exactly this value, every request."
          schema:
            type: "string"
          example: "openid email offline_access"
        - name: "state"
          in: "query"
          required: true
          description: "YOU generate this — any random string for CSRF protection; Tesla just echoes it back in the redirect. Example below is one valid random sample, generate your own per request (e.g. `python3 -c \"import secrets;print(secrets.token_urlsafe(16))\"`)."
          schema:
            type: "string"
          example: "ZnW5yQ3lX3bRLFvaYq6BDw"
        - name: "login_hint"
          in: "query"
          required: false
          description: "Optional: pre-fill the account's email address."
          schema:
            type: "string"
          example: "user@example.com"
      responses:
        "200":
          description: "Response is text/html, not JSON: an HTML form with hidden input fields (_csrf, _phase, _process, transaction_id, cancel) that must be resubmitted in Step 2, plus a Set-Cookie session cookie that must be retained."
          content:
            "text/plain":
              schema:
                type: "string"
              example: "<!-- HTML login form containing hidden fields: _csrf, _phase, _process, transaction_id, cancel -->"
      security: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/authentication.md"
        description: "Source documentation page"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO / OAuth2 (auth.tesla.com) — separate host from the main Owner API"
    post:
      operationId: "submitLogin"
      summary: "Step 2: Submit credentials and obtain an authorization code"
      description: "Submits the login form from Step 1 (same query parameters, plus the session cookie and hidden form fields) along with the user's email and password. On success, responds with a 302 redirect to the (non-resolving) redirect_uri; the authorization `code` is extracted from the Location header's query string rather than by following the redirect."
      tags:
        - "Authentication"
      parameters:
        - name: "client_id"
          in: "query"
          required: true
          description: "Same fixed constant as Step 1."
          schema:
            type: "string"
          example: "ownerapi"
        - name: "code_challenge"
          in: "query"
          required: true
          description: "Same value you generated for Step 1 — must match exactly (this endpoint doesn't use it directly, but it's part of the same query string)."
          schema:
            type: "string"
          example: "UD9XsJ5psxMmlMb061H0n0iS8l7-tkcZgBgSXcN8PfE"
        - name: "code_challenge_method"
          in: "query"
          required: true
          description: "Same fixed constant as Step 1."
          schema:
            type: "string"
          example: "S256"
        - name: "redirect_uri"
          in: "query"
          required: true
          description: "Same fixed constant as Step 1."
          schema:
            type: "string"
          example: "https://auth.tesla.com/void/callback"
        - name: "response_type"
          in: "query"
          required: true
          description: "Same fixed constant as Step 1."
          schema:
            type: "string"
          example: "code"
        - name: "scope"
          in: "query"
          required: true
          description: "Same fixed constant as Step 1."
          schema:
            type: "string"
          example: "openid email offline_access"
        - name: "state"
          in: "query"
          required: true
          description: "Same value you generated for Step 1 — must match exactly."
          schema:
            type: "string"
          example: "ZnW5yQ3lX3bRLFvaYq6BDw"
      requestBody:
        required: true
        description: "application/x-www-form-urlencoded body. A THIRD category of value, distinct from both 'fixed constant' and 'you generate it': _csrf/_phase/_process/transaction_id/cancel are issued fresh by Tesla's server on every real Step 1 call and are single-use/session-bound, so — unlike code_challenge/state — there is no formula for them and no fixed sample can ever work; they can only be read out of your own live Step 1 HTML response (the PASTE_FROM_STEP_1_RESPONSE placeholders mark exactly that). The Step 1 session cookie must also be sent as a request cookie on this call. See get_step1_fields.py alongside this spec for a script that performs the real Step 1 request and prints these 5 fields + the cookie, ready to paste in here. identity/credential are simply the account's own email/password."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              _csrf: "PASTE_FROM_STEP_1_RESPONSE"
              _phase: "PASTE_FROM_STEP_1_RESPONSE"
              _process: "PASTE_FROM_STEP_1_RESPONSE"
              transaction_id: "PASTE_FROM_STEP_1_RESPONSE"
              cancel: "PASTE_FROM_STEP_1_RESPONSE"
              identity: "user@example.com"
              credential: "your-tesla-account-password"
      responses:
        "200":
          description: "The response is a 302 redirect, not a JSON body. Parse the `code` query parameter out of the Location header — that is the authorization code needed for Step 3. If MFA is enabled on the account, the response is instead another HTML form requesting a passcode (see the mfaFactors/mfaVerify endpoints)."
          content:
            "text/plain":
              schema:
                type: "string"
              example: "HTTP/1.1 302 Found\nLocation: https://auth.tesla.com/void/callback?code=<authorization_code>&state=<state>&issuer=https%3A%2F%2Fauth.tesla.com%2Foauth2%2Fv3"
      security: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/authentication.md"
        description: "Source documentation page"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO / OAuth2 (auth.tesla.com) — separate host from the main Owner API"
  "/oauth2/v3/authorize/mfa/factors":
    get:
      operationId: "getMfaFactors"
      summary: "Step 2b (if MFA enabled): List MFA factors for the account"
      description: "Called when Step 2 responds with an MFA passcode form instead of a redirect. Retrieves the list of enrolled MFA factors (e.g. TOTP authenticator devices) for the account's transaction."
      tags:
        - "Authentication"
      parameters:
        - name: "transaction_id"
          in: "query"
          required: true
          description: "Session-issued value (same third category as Step 2's hidden fields — not generated by you, not constant) from the MFA form Tesla returned in place of Step 2's redirect."
          schema:
            type: "string"
          example: "PASTE_FROM_STEP_2_MFA_FORM"
      responses:
        "200":
          description: "data is an array of enrolled MFA factor objects; each factor's `id` is required by the subsequent verify call as factor_id."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                data:
                  - id: "factor_abc123xyz"
                    name: "Authenticator App"
                    factorType: "token:software"
                    factorProvider: "TESLA"
                    securityLevel: 1
                    activatedAt: "2021-01-01T00:00:00.000Z"
                    updatedAt: "2021-01-01T00:00:00.000Z"
      security: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/authentication.md"
        description: "Source documentation page"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO / OAuth2 (auth.tesla.com) — separate host from the main Owner API"
  "/oauth2/v3/authorize/mfa/verify":
    post:
      operationId: "verifyMfaPasscode"
      summary: "Step 2c (if MFA enabled): Submit an MFA passcode"
      description: "Submits the user's TOTP passcode for the chosen MFA factor. On success, the flow proceeds as if Step 2 had succeeded directly — a subsequent GET to /oauth2/v3/authorize with the same query params (and session cookie) then yields the 302 redirect containing the authorization code, as in Step 2."
      tags:
        - "Authentication"
      requestBody:
        required: true
        description: "JSON body: transaction_id (session-issued, from the MFA form — same as getMfaFactors), factor_id (session-issued, the chosen factor's id from getMfaFactors' response), passcode (you generate this — the current 6-digit code from your own TOTP authenticator app, e.g. `python3 -c \"import pyotp;print(pyotp.TOTP('YOUR_BASE32_SECRET').now())\"` if you have the enrollment secret). A fresh _csrf token (obtained alongside the MFA form) must also be sent, typically as a header."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              transaction_id: "PASTE_FROM_STEP_2_MFA_FORM"
              factor_id: "PASTE_FROM_MFA_FACTORS_RESPONSE"
              passcode: "123456"
      responses:
        "200":
          description: "valid: true confirms the passcode was accepted; the caller must then repeat the Step 2 GET/POST to /oauth2/v3/authorize (with the session cookie) to obtain the final 302 redirect and authorization code."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                data:
                  id: "factor_abc123xyz"
                  challengeId: "chal_def456uvw"
                  factorType: "token:software"
                  valid: true
      security: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/authentication.md"
        description: "Source documentation page"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO / OAuth2 (auth.tesla.com) — separate host from the main Owner API"
  "/oauth2/v3/token":
    post:
      operationId: "getOrRefreshToken"
      summary: "Step 3: Exchange an authorization code, or refresh_token, for a Bearer access token"
      description: "**Step 3: Exchange the authorization code for a Bearer access token** (authorization_code): Exchanges the authorization code obtained in Step 2 for an OAuth2 access_token/refresh_token pair. The same endpoint (with grant_type=refresh_token instead) is also used to refresh an expired access token — see refreshToken.\n\n**Refresh an expired access token** (refresh_token): Exchanges a previously issued refresh_token for a new access_token/refresh_token pair, without requiring the user to log in again."
      tags:
        - "Authentication"
      requestBody:
        required: true
        description: "grant_type in the body selects the variant — see the named examples below."
        content:
          "application/json":
            schema:
              type: "object"
            examples:
              authorization_code:
                summary: "grant_type=authorization_code"
                description: "JSON body. grant_type: 'authorization_code' (fixed constant). client_id: 'ownerapi' (fixed constant). code: the authorization code from Step 2 — dynamic, only exists after a real login, cannot be pre-generated. code_verifier: YOU generate this in Step 1 and reuse it here verbatim (NOT the code_challenge) — the sample shown is the exact verifier that matches the code_challenge example on Step 1/2 (`UD9XsJ5psxMmlMb061H0n0iS8l7-tkcZgBgSXcN8PfE`), so the pair is consistent end-to-end if you copy both samples together; generate your own fresh pair for a real login. redirect_uri: fixed constant, same value used in Steps 1-2."
                value:
                  grant_type: "authorization_code"
                  client_id: "ownerapi"
                  code: "<authorization code from Step 2 — cannot be pre-generated, only exists after a real login>"
                  code_verifier: "COVNnBfIh4m92P2C_0Clq1PfjBH-BE4Exf9uXsmAUuZa6YqlhJU8FU5XTyMwaItwfdpdyXv5cGbn9gEa37GkxA"
                  redirect_uri: "https://auth.tesla.com/void/callback"
              refresh_token:
                summary: "grant_type=refresh_token"
                description: "JSON body. grant_type: 'refresh_token' (fixed constant). client_id: 'ownerapi' (fixed constant). refresh_token: a previously issued refresh token — dynamic, only exists after a real login/token exchange, cannot be pre-generated. scope: 'openid email offline_access' (fixed constant)."
                value:
                  grant_type: "refresh_token"
                  client_id: "ownerapi"
                  refresh_token: "<refresh token from a prior token exchange — cannot be pre-generated, only exists after a real login>"
                  scope: "openid email offline_access"
      responses:
        "200":
          description: "Successful token response. See the named examples for the differences between the authorization_code and refresh_token variants."
          content:
            "application/json":
              schema:
                type: "object"
              examples:
                authorization_code:
                  summary: "grant_type=authorization_code response"
                  description: "access_token is short-lived (expires_in seconds, typically 300s = 5 minutes) — use refreshToken well before expiry. refresh_token is long-lived and must be stored securely; it is required to obtain new access tokens without re-authenticating. If the account has MFA enabled and Step 2 returned an HTML MFA form instead of a redirect, complete the MFA flow (getMfaFactors + verifyMfaPasscode) before this step."
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expires_in: 300
                    state: "of the union"
                    token_type: "Bearer"
                refresh_token:
                  summary: "grant_type=refresh_token response"
                  description: "Refreshed access tokens are valid for 8 hours (28800s), longer than the initial 5-minute token from the code exchange. A new refresh_token is also issued and should replace the previously stored one."
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expires_in: 28800
                    state: "of the union"
                    token_type: "Bearer"
      security: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/authentication.md"
        description: "Source documentation page"
      servers:
        - url: "https://auth.tesla.com"
          description: "Tesla SSO / OAuth2 (auth.tesla.com) — separate host from the main Owner API"
  "/trip-planner/api/v1/tripplan":
    post:
      operationId: "planTrip"
      summary: "Compute a trip route plan with charging stops"
      description: "Computes a routing itinerary using vehicle specifications and current battery level. When the journey exceeds the vehicle's range, the response automatically inserts Supercharger waypoints along the route."
      tags:
        - "API Basics"
        - "Trip Planner"
      requestBody:
        required: true
        description: "car_trim/car_type identify the vehicle variant; origin/destination are lat,lng coordinate pairs; origin_soe is the initial state of energy as a fraction (0.0-1.0); vin identifies the vehicle."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              car_trim: "74D"
              car_type: "ModelY"
              destination: "37.485767,-122.340207"
              origin: "37.79307,-125.108"
              origin_soe: 0.64
              vin: "5YJSA11111111111"
      responses:
        "200":
          description: "destination_soe/origin_soe are state-of-energy fractions at trip end/start; polylines holds encoded route geometry; stops lists charging stop details/arrival battery levels; the total_* fields are cumulative drive/charge time, energy, and distance metrics; status reports plan outcome (e.g. success with/without stops)."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                destination_soe: 0.064
                origin_soe: 0.65
                polylines:
                  - "_truncated_encoded_polyline_data"
                status: "TRIP_PLAN_SUCCESS_WITH_STOPS"
                stops:
                  - "_truncated_list_of_charging_stops"
                total_charge_dur_s: 5299.774
                total_charge_kWh: 227.65
                total_drive_dur_s: 40274.0
                total_drive_kWh: 229.461
                total_drive_mi: 729.106
                _truncated: true
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/api-basics/tripplan.md"
        description: "Source documentation page"
