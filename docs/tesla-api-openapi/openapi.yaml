  "/api/1/energy_sites/{site_id}/tariff_rate":
    get:
      operationId: "getEnergySiteTariffRate"
      summary: "Get the configured utility tariff rate structure for an energy site"
      description: "Provides the utility rate plan configuration used for Time-Based Control mode, including daily/demand/energy charges by season and time-of-use period, plus a matching sell_tariff for energy exported to the grid. Updates roughly every 30 minutes."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "energy_charges/demand_charges are keyed by season then by TOU period name (or 'ALL'). seasons.<Season>.tou_periods defines the day-of-week/hour ranges for each TOU period name used above. sell_tariff mirrors the same shape for energy exported to the grid (feed-in rates). Truncated example — original docs example includes more OFF_PEAK/PARTIAL_PEAK sub-ranges per period."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  name: "Amber"
                  utility: "Amber"
                  daily_charges:
                    - amount: 0
                      name: "Charge"
                  demand_charges:
                    ALL:
                      ALL: 0
                    Summer: {}
                    Winter: {}
                  energy_charges:
                    ALL:
                      ALL: 0
                    Summer:
                      ON_PEAK: 0.43
                      PARTIAL_PEAK: 0.43
                      OFF_PEAK: 0.01
                    Winter: {}
                  seasons:
                    Summer:
                      fromDay: 1
                      toDay: 31
                      fromMonth: 1
                      toMonth: 12
                      tou_periods:
                        ON_PEAK:
                          - fromDayOfWeek: 0
                            toDayOfWeek: 6
                            fromHour: 5
                            fromMinute: 30
                            toHour: 7
                            toMinute: 0
                        PARTIAL_PEAK:
                          - fromDayOfWeek: 0
                            toDayOfWeek: 6
                            fromHour: 7
                            fromMinute: 0
                            toHour: 10
                            toMinute: 0
                        OFF_PEAK:
                          - fromDayOfWeek: 0
                            toDayOfWeek: 6
                            fromHour: 20
                            fromMinute: 0
                            toHour: 5
                            toMinute: 30
                    Winter:
                      fromDay: 0
                      toDay: 0
                      fromMonth: 0
                      toMonth: 0
                      tou_periods: {}
                  sell_tariff:
                    name: "Amber"
                    utility: "Amber"
                    daily_charges:
                      - amount: 0
                        name: "Charge"
                    demand_charges:
                      ALL:
                        ALL: 0
                      Summer: {}
                      Winter: {}
                    energy_charges:
                      ALL:
                        ALL: 0
                      Summer:
                        ON_PEAK: 0.3
                        PARTIAL_PEAK: 0.1
                        OFF_PEAK: 0.01
                      Winter: {}
                    seasons:
                      Summer:
                        fromDay: 1
                        toDay: 31
                        fromMonth: 1
                        toMonth: 12
                        tou_periods:
                          ON_PEAK:
                            - fromDayOfWeek: 0
                              toDayOfWeek: 6
                              fromHour: 5
                              fromMinute: 30
                              toHour: 7
                              toMinute: 0
                          PARTIAL_PEAK:
                            - fromDayOfWeek: 0
                              toDayOfWeek: 6
                              fromHour: 7
                              fromMinute: 0
                              toHour: 10
                              toMinute: 0
                          OFF_PEAK:
                            - fromDayOfWeek: 0
                              toDayOfWeek: 6
                              fromHour: 20
                              fromMinute: 0
                              toHour: 5
                              toMinute: 30
                      Winter:
                        fromDay: 0
                        toDay: 0
                        fromMonth: 0
                        toMonth: 0
                        tou_periods: {}
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/state.md"
        description: "Source documentation page"
