  "/api/1/vehicles/{vehicle_id}/vehicle_data":
    get:
      operationId: "getVehicleData"
      summary: "Get full vehicle data (rollup of all state sub-objects)"
      description: "Returns a rollup of all vehicle telemetry and configuration in a single call: drive_state, climate_state, charge_state, gui_settings, vehicle_state, and vehicle_config, plus top-level vehicle metadata. This is the modern replacement for the deprecated per-category data_request/* endpoints.\n\n**Sub-object breakdown:**\n- `charge_state` — Charge state sub-object (battery level, charging status, range). Returned as the `charge_state` key inside GET vehicle_data. Notable fields: `battery_level`/`usable_battery_level` (SoC %), `charging_state` (e.g. Charging/Disconnected/Complete/Stopped), `charge_limit_soc*` (target charge % and its allowed min/max/std bounds), `battery_range`/`ideal_battery_range`/`est_battery_range` (miles, GUI-unit independent), `scheduled_charging_*` and `scheduled_departure_*` (Scheduled Charging / Scheduled Departure feature state), `fast_charger_present`/`fast_charger_type`/`fast_charger_brand` (Supercharger/CCS detection).\n- `climate_state` — Climate state sub-object (interior temperature, HVAC status). Returned as the `climate_state` key inside GET vehicle_data. Notable fields: `inside_temp`/`outside_temp` and `driver_temp_setting`/`passenger_temp_setting` are in Celsius regardless of gui_settings; `is_climate_on`/`is_auto_conditioning_on` reflect HVAC active state; `cabin_overheat_protection`/`cop_activation_temperature` control the Cabin Overheat Protection feature; `climate_keeper_mode` covers Keep/Dog/Camp modes.\n- `drive_state` — Drive state sub-object (GPS location, heading, speed, power). Returned as the `drive_state` key inside GET vehicle_data. `shift_state`/`speed` are null when parked; `shift_state` takes values like P/R/N/D while driving. `power` is instantaneous kW draw (negative when regenerating/charging). `gps_as_of` is a Unix seconds timestamp for when the GPS fix was taken, separate from the overall `timestamp` field (Unix ms).\n- `gui_settings` — GUI settings sub-object (display units and preferences). Returned as the `gui_settings` key inside GET vehicle_data. These fields only affect how the vehicle's own touchscreen (and typically the mobile app) formats numbers for display — they do NOT change the units of any other vehicle_data field, which are always returned in a fixed unit (e.g. range values always in miles).\n- `vehicle_state` — Vehicle state sub-object (locks, doors, odometer, software, Sentry Mode). Returned as the `vehicle_state` key inside GET vehicle_data. `df/dr/pf/pr` are door states (driver/passenger, front/rear; 0=closed), `ft/rt` are frunk/trunk states (0=closed, non-zero=open); `locked` is overall door lock status; `sentry_mode`/`sentry_mode_available` and `valet_mode`/`valet_pin_needed` cover security features; `tpms_pressure_*` are per-wheel tire pressures; `software_update` and `speed_limit_mode` are nested sub-objects with their own status fields.\n- `vehicle_config` — Vehicle config sub-object (model, trim, color, wheels, charge port). Returned as the `vehicle_config` key inside GET vehicle_data. `car_type` identifies the model line (e.g. models/modelx/model3/models2 codenames), `trim_badging` gives the drivetrain/trim (e.g. '100d'), `charge_port_type` distinguishes US/EU/CCS charge port hardware; most fields describe fixed hardware options set at build time rather than dynamic vehicle state."
      tags:
        - "Vehicle State"
      parameters:
        - name: "vehicle_id"
          in: "path"
          required: true
          description: "The vehicle's ID as returned by the vehicle list/products endpoint."
          schema:
            type: "string"
      responses:
        "200":
          description: "This is the primary, authoritative entry point for vehicle telemetry — every field documented separately for charge_state, climate_state, drive_state, gui_settings, vehicle_state, and vehicle_config (see their dedicated entries below for the full field lists) is nested under the corresponding key here; those dedicated entries are informational sub-object breakdowns of THIS response, not independently callable paths."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  id: 12345678901234567
                  user_id: 123456789
                  vehicle_id: 1234567890
                  vin: "5YJSA11111111111"
                  display_name: "Nikola 2.0"
                  state: "online"
