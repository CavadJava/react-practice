openapi: "3.0.3"
info:
  title: "Tesla Owner API (Unofficial)"
  version: "2026.08.16"
  description: "**Unofficial, community-reverse-engineered** specification for the Tesla mobile-app \"Owner API\", generated from https://tesla-api.timdorr.com (the timdorr/tesla-api community documentation project) and cross-checked against that project's canonical internal endpoint registry (`ownerapi_endpoints.json`, 551 entries).\n\n**This is not official Tesla documentation.** Tesla does not publish or support a public API for this surface and may change or break any of it without notice. Using it may violate Tesla's Terms of Service — use at your own risk, for personal/research purposes.\n\nGenerated notes from source pages:\n- Authentication uses OAuth 2.0 with PKCE against Tesla's SSO service, hosted on a separate host (auth.tesla.com) from the main owner-api.\n- Tesla's SSO service has a WAF that blocks repeated excessive requests; avoid automatic retries and keep call volume to a minimum. The service requires TLS 1.2+ and rejects/JS-challenges obviously browser-like User-Agent headers.\n- client_id is always the literal string 'ownerapi'; redirect_uri is always 'https://auth.tesla.com/void/callback' (a non-resolving address by design — the authorization code is extracted from the redirect's Location header, the request is never actually followed).\n- CONFIRMED BY LIVE TEST (2026-08-16): scripting Step 1 (GET /oauth2/v3/authorize) with a plain HTTP client gets served an Akamai bot-management challenge (_abck/bm_sz cookies, no actual login form) instead of the real hidden fields — Tesla's WAF fingerprints non-browser TLS/HTTP clients and blocks them. The reliable way to get an authorization code for personal use is the manual browser flow real community clients (e.g. TeslaPy) use: build the Step 1 URL yourself (see get_login_url.py alongside this spec), open it in a real browser, log in normally, then copy the `code` query parameter straight out of the browser's address bar after it redirects to the non-resolving void/callback — this needs Step 3 only, skipping the scripted Step 2 hidden-field dance entirely.\n- get_step1_fields.py (alongside this spec) is kept for reference/experimentation but is expected to fail with the WAF challenge above for most callers; get_login_url.py implements the recommended manual-browser flow instead.\n- Base URI: https://owner-api.teslamotors.com/ (primary endpoint for most API requests)\n- China region variant: use owner-api.vn.cloud.tesla.cn for the API and auth.tesla.cn for auth\n- All requests require a User-Agent header (any value accepted); identifying your app via this header is recommended\n- The API has three surfaces: (1) state & commands — point-in-time vehicle state and basic controls, loosely REST but with notable deviations, (2) streaming telemetry — JSON data streamed at up to half-second intervals over HTTP, (3) Autopark/Summon — WebSocket-based streaming control for HW1/HW2/3 vehicles\n- Because the API deviates from strict REST conventions, standard REST client tools/libraries may not work with it out of the box\n- Nearly all endpoints in Tesla's internal endpoint registry are marked AUTH:true, implying an OAuth2 bearer-token scheme, though the fetched docs pages did not themselves detail the token/OAuth flow\n- Tesla's vehicle telemetry (charge_state, climate_state, drive_state, gui_settings, vehicle_state, vehicle_config) is NOT a set of separate HTTP endpoints in the current API. It is delivered as nested sub-objects of the single GET /api/1/vehicles/{vehicle_id}/vehicle_data response, confirmed against the canonical internal endpoint registry which contains exactly one entry (VEHICLE_DATA) for this whole data surface and no separate CHARGE_STATE/CLIMATE_STATE/DRIVE_STATE/GUI_SETTINGS/VEHICLE_STATE/VEHICLE_CONFIG entries.\n- Legacy standalone per-category endpoints did exist historically at GET /api/1/vehicles/{vehicle_id}/data_request/<category> (e.g. data_request/charge_state, data_request/climate_state, data_request/drive_state, data_request/gui_settings, data_request/vehicle_state, data_request/vehicle_config). The docs explicitly state each of these 'was deprecated and returns 404'. They are documented below as historical/informational context inside each corresponding sub-object entry's description, but the authoritative, currently-live path used for `path` on each is the VEHICLE_DATA path per instructions, since the registry has no live entry for the deprecated data_request/* routes.\n- mobile_enabled (GET /api/1/vehicles/{id}/mobile_enabled) is documented as its own standalone endpoint returning a bare boolean, not marked deprecated by the docs. However it does NOT appear anywhere in the canonical 551-entry endpoint registry (searched case-insensitively for MOBILE_ENABLED/MOBILE_ACCESS/mobile_enabled with no hits), so its liveness is unverified against the authoritative source; it is included with unverified_path=true.\n- nearby_charging_sites and release_notes (the latter documented on the 'misc' docs page) ARE confirmed as real, currently-live standalone endpoints, matched exactly against the registry's NEARBY_CHARGING_SITES and RELEASE_NOTES entries respectively (both GET, both auth=true, both keyed by {vehicle_id}).\n- All *_range values returned within vehicle_data are in miles regardless of the user's configured GUI distance units (gui_settings.gui_distance_units only affects app/UI display, not the raw API values).\n- All vehicle commands are authenticated POST requests to https://owner-api.teslamotors.com, using an OAuth bearer token (auth: true) obtained via Tesla's account login flow.\n- Command endpoints (other than wake_up) follow the pattern POST api/1/vehicles/{vehicle_id}/command/{command_name}.\n- The vehicle must be online before most commands will succeed; if the car is asleep, call WAKE_UP (POST api/1/vehicles/{vehicle_id}/wake_up) first and poll the vehicle summary until its `state` field is `online` (docs suggest allowing at least 30 seconds, since waking can take several seconds).\n- These commands alter the vehicle's state and return a boolean `result` field indicating success, plus a `reason` string that is populated when `result` is false (e.g. vehicle asleep, command rejected).\n- The standard response envelope for command endpoints is `{ \"response\": { \"result\": bool, \"reason\": string } }`; the wake_up endpoint is an exception and instead returns the full vehicle summary object.\n- {vehicle_id} in the path is Tesla's internal numeric vehicle id (id_s from the vehicle list/summary endpoints), not the VIN.\n- Path parameter is emitted as {vehicle_id} throughout, matching the canonical ownerapi_endpoints.json registry; the community docs site (tesla-api.timdorr.com) labels the same URL segment {id}.\n- `charge_standard` and `charge_max_range` (documented on charging.md) do not appear anywhere in the provided 551-entry canonical registry — they appear to have been superseded by the parameterized `set_charge_limit` endpoint and are marked unverified_path: true; their method/path/auth come only from the community docs.\n- `set_vehicle_name` (misc.md) also does not appear in the canonical registry. The docs page itself notes it was removed from ownerapi_endpoints.json in app version 4.19.0-1639, then became usable again client-side in app 4.20.5+ on vehicle software 2023.12+; marked unverified_path: true.\n- calendar.md, the source page for CALENDAR_SYNC, contains only a bare '# Calendar' heading on tesla-api.timdorr.com with no parameter, request, or response documentation. Method/path/auth for this endpoint were taken from the canonical registry (upcoming_calendar_entries); no requestBodyExample/responseExample could be sourced beyond the generic result/reason shape.\n- Most command endpoints only show the bare `{ \"reason\": \"\", \"result\": true }` object in the community docs; per instructions these are wrapped in Tesla's actual top-level `{ \"response\": { ... } }` envelope for responseExample.\n- TAKE_DRIVENOTE currently returns `not_supported` per the docs, as the feature is not implemented server-side despite the endpoint existing.\n- SET_COP_TEMP (set_cop_temp) is noted in the docs as 'in progress' and not fully functional/enabled as of the source page's last update (2022-12-13).\n- Base URI for the Energy Products API is https://owner-api.teslamotors.com/api/1/energy_sites/{site_id}/ (per tesla-api.timdorr.com/energy-products/energy.md).\n- site_id (also called energy_site_id in Tesla's internal endpoint registry) identifies a specific energy installation (Powerwall/Solar site) and must first be obtained from Tesla's product list endpoint before calling any of the endpoints below.\n- The community docs group energy endpoints into three categories: History (time-series power/energy data), State (current status/config snapshots), and Commands (POST actions that change site configuration).\n- Cross-referenced against a canonical internal Tesla endpoint registry (551 entries). Endpoints found in that registry use its exact TYPE (HTTP method), URI, and AUTH values as authoritative. Two endpoints described on tesla-api.timdorr.com (plain 'history' and 'site_status') have no matching entry in that registry — they are flagged unverified_path: true and use the path/method as documented on the community site.\n- Nearly all Commands-page endpoints beyond backup, site_name, and storm_mode are listed by tesla-api.timdorr.com only by name/path with no documented request or response fields ('these endpoints are not yet documented'); for those, requestBodyExample/responseExample are left null rather than fabricated.\n- Command endpoints that ARE documented (backup, site_name, storm_mode) all return the same generic acknowledgement shape: {\"response\": {\"code\": 201, \"message\": \"Updated\"}}."
  license:
    name: "Source docs: MIT (timdorr/tesla-api)"
    url: "https://github.com/timdorr/tesla-api"
externalDocs:
  description: "Source documentation"
  url: "https://tesla-api.timdorr.com"
servers:
  - url: "https://owner-api.teslamotors.com"
    description: "Main Owner API (all vehicle/energy endpoints unless noted)"
  - url: "https://owner-api.vn.cloud.tesla.cn"
    description: "China region variant of the main Owner API"
tags:
  - name: "API Basics"
    description: "Account/session-level endpoints that don't belong to a single vehicle or energy site."
  - name: "Authentication"
    description: "Tesla SSO OAuth2/PKCE login, token exchange, MFA, and refresh flow. Hosted on auth.tesla.com, not owner-api.teslamotors.com."
  - name: "Calendar"
    description: ""
  - name: "Charge State"
    description: "Battery/charging-specific state and nearby charging sites."
  - name: "Charging"
    description: ""
  - name: "Climate"
    description: ""
  - name: "Energy Products"
    description: "Powerwall/solar energy site history, live status, configuration, and commands."
  - name: "Media"
    description: ""
  - name: "Misc"
    description: ""
  - name: "Products"
    description: "Listing Tesla Energy (solar/Powerwall) products on the account."
  - name: "Sharing"
    description: ""
  - name: "Software Update"
    description: ""
  - name: "Sunroof"
    description: ""
  - name: "Trip Planner"
    description: "Route planning with automatic Supercharger stop insertion."
  - name: "Users"
    description: "The authenticated Tesla account holder's profile, keys, and app feature flags."
  - name: "Vehicle Commands"
    description: "POST actions that change vehicle state (locks, climate, charging, etc). The vehicle must be online (see Wake)."
  - name: "Vehicle State"
    description: "Read-only vehicle telemetry and configuration (GET vehicle_data and its sub-objects)."
  - name: "Vehicles"
    description: "Listing and summary info for vehicles on the account."
  - name: "Windows"
    description: ""
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "OAuth2 access_token obtained via the Authentication flow (see the Authentication tag)."
paths:
  "/api/1/energy_sites/rate_tariffs":
    get:
      operationId: "getEnergySiteRateTariffs"
      summary: "List available utility rate tariff identifiers"
      description: "Lists available utility rate plan identifiers and metadata (tariff ID, description, utility name, country, state) that can be referenced when configuring a site's tariff."
      tags:
        - "Energy Products"
      responses:
        "200":
          description: "Not scoped to a site_id (no site_id path param). 'count' reflects the total number of tariff entries available (233 in the example); response array is a truncated sample here."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  - tariffID: "AE-R-CS"
                    description: "Residential - Community Solar"
                    utility: "Austin Energy"
                    country: "US"
                    state: "TX"
                  - tariffID: "APS-ET-1"
                    description: "Residential - Time of Use, Time Advantage, 9pm - 9 am"
                    utility: "Arizona Public Service Co"
                    country: "US"
                    state: "AZ"
                count: 233
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/state.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/backup":
    post:
      operationId: "setEnergySiteBackupReserve"
      summary: "Set the battery backup reserve percentage for an energy site"
      description: "Adjusts the battery backup reserve energy percentage that is held back for use during grid outages."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      requestBody:
        required: true
        description: "backup_reserve_percent (number): the percentage of battery capacity to reserve for backup/outage use."
        content:
          "application/json":
            schema:
              type: "object"
            example:
              backup_reserve_percent: 75
      responses:
        "200":
          description: "Generic acknowledgement response shared by several command endpoints (code/message)."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  code: 201
                  message: "Updated"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/backup_time_remaining":
    get:
      operationId: "getEnergySiteBackupTimeRemaining"
      summary: "Get estimated backup time remaining for an energy site"
      description: "Calculates how many hours the battery system can sustain the home if it transitions to off-grid (backup) operation."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "time_remaining_hours is a float representing estimated hours of backup runtime."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  time_remaining_hours: 2.0933370487093645
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/state.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/calendar_history":
    get:
      operationId: "getEnergyCalendarHistory"
      summary: "Get power or energy history for an energy site ending on a specific date"
      description: "Returns power generation/storage at 15-minute intervals for a specified day, or energy generation/storage for a specified period (day/week/month/year/lifetime) ending on the given end_date. Timestamps in the response represent the start of a period."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
        - name: "kind"
          in: "query"
          required: true
          description: "Either 'power' or 'energy'."
          schema:
            type: "string"
        - name: "end_date"
          in: "query"
          required: true
          description: "Last day for statistics retrieval, formatted yyyy-mm-ddThh:mm:ss-hh:mm (local time) or yyyy-mm-ddThh:mm:ssZ (UTC). Avoid using midnight (00:00:00) as the time value — it can produce zero or garbage data depending on period type."
          schema:
            type: "string"
        - name: "period"
          in: "query"
          required: false
          description: "Required when kind=energy; one of 'day', 'week', 'month', 'year', 'lifetime'. Ignored when kind=power."
          schema:
            type: "string"
        - name: "interval"
          in: "query"
          required: false
          description: "Only confirmed valid value is '15m', usable only with period=day, to return daily data in 15-minute increments."
          schema:
            type: "string"
      responses:
        "200":
          description: "Shown response is for kind=power. For kind=energy the response adds a 'period' field and time_series entries with the same cumulative energy fields as the /history endpoint (solar_energy_exported, grid_energy_imported, battery_energy_exported, consumer_energy_imported_from_*, etc). Docs note data consistency caveats across different period types."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  serial_number: "313dbc37-555c-45b1-83aa-62a4ef9ff7ac"
                  time_zone_offset: -420
                  time_series:
                    - timestamp: "2022-04-29T00:00:00-07:00"
                      solar_power: 0
                      battery_power: 0
                      grid_power: 0
                      grid_services_power: 0
                      generator_power: 0
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/history.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/command":
    post:
      operationId: "sendEnergySiteCommand"
      summary: "Send a generic command to an energy site"
      description: "Generic command dispatch endpoint for the energy site. tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/event":
    post:
      operationId: "sendEnergySiteOptEvent"
      summary: "Send an opt in/out event for an energy site program"
      description: "Sends a demand-response/grid-event opt in/out signal for the energy site. tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/grid_import_export":
    post:
      operationId: "setEnergySiteGridImportExportConfig"
      summary: "Set grid import/export configuration for an energy site"
      description: "Configures grid import/export behavior for the site (e.g. grid charging allowance, non-export configuration). tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/history":
    get:
      operationId: "getEnergyHistory"
      summary: "Get power or energy history for an energy site"
      description: "Returns instantaneous power generation/storage in watts at 15-minute intervals for the previous day (kind=power), or cumulative energy generation/storage in kWh for a specified recent period (kind=energy)."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
        - name: "kind"
          in: "query"
          required: true
          description: "Either 'power' (instantaneous power at 15-minute intervals for the previous day) or 'energy' (cumulative energy for a period)."
          schema:
            type: "string"
        - name: "period"
          in: "query"
          required: false
          description: "Required when kind=energy; one of 'day', 'week', 'month', 'year'. Ignored when kind=power."
          schema:
            type: "string"
      responses:
        "200":
          description: "Shown response is for kind=power. For kind=energy the response instead includes a 'period' field and time_series entries with cumulative Wh fields: solar_energy_exported, generator_energy_exported, grid_energy_imported, grid_services_energy_imported, grid_services_energy_exported, grid_energy_exported_from_solar/generator/battery, battery_energy_exported, battery_energy_imported_from_grid/solar/generator, consumer_energy_imported_from_grid/solar/battery/generator."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  serial_number: "313dbc37-555c-45b1-83aa-62a4ef9ff7ac"
                  time_series:
                    - timestamp: "2022-05-13T00:00:00-07:00"
                      solar_power: 0
                      battery_power: 0
                      grid_power: 0
                      grid_services_power: 0
                      generator_power: 0
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/history.md"
        description: "Source documentation page"
      x-unverified-path: true
  "/api/1/energy_sites/{site_id}/live_status":
    get:
      operationId: "getEnergySiteLiveStatus"
      summary: "Get real-time power flow and status for an energy site"
      description: "Retrieves real-time operational metrics for the site including solar production, battery power, grid import/export, home load consumption, grid status, and storm mode state."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Example shown is for a solar-only site without Powerwalls (energy_left/total_pack_energy/percentage_charged are 0/1/0 in that case). Sites with Powerwalls populate battery capacity fields and wall_connectors when Wall Connectors are present."
          content:
            "application/json":
              schema:
                type: "object"
              example:
                response:
                  solar_power: 7720
                  energy_left: 0
                  total_pack_energy: 1
                  percentage_charged: 0
                  battery_power: 0
                  load_power: 4517.14990234375
                  grid_status: "Unknown"
                  grid_services_active: false
                  grid_power: -3202.85009765625
                  grid_services_power: 0
                  generator_power: 0
                  island_status: "island_status_unknown"
                  storm_mode_active: false
                  timestamp: "2022-07-28T17:11:27Z"
                  wall_connectors: null
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/state.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/off_grid_vehicle_charging_reserve":
    post:
      operationId: "setEnergySiteOffGridVehicleChargingReserve"
      summary: "Set the off-grid vehicle charging reserve percentage for an energy site"
      description: "Sets the battery percentage reserved to support vehicle charging while the site is operating off-grid (Powerwall+ 'off-grid vehicle charging reserve' feature referenced in site_info.components.off_grid_vehicle_charging_reserve_supported and site_info.off_grid_vehicle_charging_reserve_percent). tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/operation":
    post:
      operationId: "setEnergySiteOperationMode"
      summary: "Set the operating mode for an energy site"
      description: "Sets the site's default operating mode (site_info.default_real_mode observes values such as 'self_consumption', suggesting backup-only/autonomous modes also exist). tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/preference":
    post:
      operationId: "setEnergySitePreference"
      summary: "Set a site-level preference for an energy site"
      description: "Sets a site-level preference/configuration flag. tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Not documented on tesla-api.timdorr.com. (Response shape is not documented by the source; not yet confirmed.)"
      security:
        - BearerAuth: []
      externalDocs:
        url: "https://tesla-api.timdorr.com/energy-products/energy/commands.md"
        description: "Source documentation page"
  "/api/1/energy_sites/{site_id}/program":
    post:
      operationId: "enrollEnergySiteProgram"
      summary: "Enroll or update an energy site's program participation"
      description: "Enrolls or updates the energy site's participation in a utility or Tesla energy program. tesla-api.timdorr.com lists this endpoint's path but does not document its request/response fields."
      tags:
        - "Energy Products"
      parameters:
        - name: "site_id"
          in: "path"
          required: true
          description: "Tesla energy site identifier."
