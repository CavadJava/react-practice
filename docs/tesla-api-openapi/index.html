<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tesla Owner API (Unofficial) — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    #topbar {
      background: #18181b; color: #fff; padding: 10px 20px; font: 14px/1.4 -apple-system, sans-serif;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #topbar strong { color: #ff4d4f; }
    #topbar a { color: #7dd3fc; }
  </style>
</head>
<body>
  <div id="topbar">
    <strong>⚠ Unofficial / community-sourced</strong>
    — generated from
    <a href="https://tesla-api.timdorr.com" target="_blank" rel="noopener">tesla-api.timdorr.com</a>.
    Not affiliated with or endorsed by Tesla. Using this API may violate Tesla's Terms of Service. See README.md.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: -1,
      });
    };
  </script>
</body>
</html>
